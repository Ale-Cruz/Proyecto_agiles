<div class="stock-preview" role="status"><div><strong data-stock-title>{% if producto_seleccionado %}{{ producto_seleccionado.nombre }}{% else %}Selecciona un producto para consultar su stock.{% endif %}</strong><small data-stock-code>{% if producto_seleccionado %}{{ producto_seleccionado.codigo }} · Stock actual{% endif %}</small></div><strong class="stock-number" data-stock-count>{% if producto_seleccionado %}{{ producto_seleccionado.stock }}{% endif %}</strong><input type="hidden" id="id_producto" name="producto" value="{% if producto_seleccionado %}{{ producto_seleccionado.pk }}{% endif %}"></div>
