{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#800000">
  <meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"includeIndicatorStyles":false,"attributesToSettle":["class","width","height"],"defaultSettleDelay":0,"historyCacheSize":0,"historyRestoreAsHxRequest":false}'>
  <title>{% block title %}Cafetería ITCA{% endblock %}</title>
  <link rel="icon" href="{% static 'cafeteria/favicon.svg' %}?v=itca-1" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'cafeteria/vendor/tabler.min.css' %}">
  <link rel="stylesheet" href="{% static 'cafeteria/panel.css' %}?v=inventario-2">
  <script src="{% static 'cafeteria/vendor/htmx-2.0.11.min.js' %}" defer></script>
  <script src="{% static 'cafeteria/panel.js' %}?v=inventario-2" defer></script>
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}" hx-history="false">
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-coffee" viewBox="0 0 24 24"><path d="M5 8h12v7a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5V8Zm12 1h1a3 3 0 1 1 0 6h-1M7 3v2m5-2v2m5-2v2M3 21h17"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3V10Zm6 10v-7h6v7"/></symbol>
    <symbol id="i-sales" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 7h10M7 12h2m6 0h2M7 16h2m6 0h2"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="m12 3 9 5v9l-9 5-9-5V8l9-5Zm0 10v9M3 8l9 5 9-5M7 5.8l9 5"/></symbol>
    <symbol id="i-clipboard" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 3h6v4H9V3Zm0 9h6m-6 4h4"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 3v17h17M8 15v-4m5 4V6m5 9V9"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Zm-4 9 3 3 5-6"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21v-3a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v3m0-17a4 4 0 0 1 0 8m4 9v-3a5 5 0 0 0-3-4"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9 3-1 3-3 1-2 4 2 3v4l4 2 3-1 3 1 4-2v-4l2-3-2-4-3-1-1-3H9Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M10 4H4v16h6m-1-8h12m-4-4 4 4-4 4"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/></symbol>
  </svg>
  {% block content %}{% endblock %}
</body>
</html>
